name: Docker Multi-Arch Build and Push

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build amd64 image and load locally for testing
      # Uses a separate cache scope so amd64 layers don't contaminate the
      # multi-arch build (which would produce broken arm64 images).
      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ros2-drone-dev:test
          cache-from: type=gha,scope=amd64-test
          cache-to: type=gha,mode=max,scope=amd64-test

      - name: Verify colcon build
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace ros2-drone-dev:test -c "
            source /opt/ros/jazzy/setup.bash &&
            rm -rf build install log &&
            colcon build --symlink-install
          "

      # Build both architectures and push to Docker Hub
      - name: Build and push multi-arch
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ros2-delivery-drone:latest
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch
